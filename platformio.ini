; Elektronischer Schiessstand - Proof of Concept
;   rifle : ESP32 (Gewehr, TSOP34836 + Taster)
;   range : ESP8266 NodeMCU (Schiessstand, IR-Sender je Zielscheibe)
[env]
framework = arduino
monitor_speed = 115200
lib_deps = crankyoldgit/IRremoteESP8266@^2.8.6

[env:rifle]
platform = espressif32@6.9.0
board = esp32dev
build_src_filter = +<rifle/>

[env:range]
platform = espressif8266@4.2.1
board = nodemcuv2
build_src_filter = +<range/>

; Bring-up Schritt 1: nur IR-Strecke testen (Ziel sendet dauerhaft, kein ESP-NOW noetig)
[env:range_irtest]
extends = env:range
build_flags = -DIR_LINK_TEST
